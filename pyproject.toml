[project]
name = "hokma"
version = "0.0.21"
description = "Hokma: installable harness by SiomTrading"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "psycopg[binary]==3.3.8",
    "faster-whisper==1.2.1",
    "av==15.1.0",
    "pywinpty==3.0.3; sys_platform == 'win32'",
    "keyring==25.7.0",
    "databento==0.90.0",
]

[project.scripts]
hokma = "hokma_cli.main:main"

[dependency-groups]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/hokma", "cli/hokma_cli"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
