[project]
name = "hokma"
version = "0.0.26"
description = "Hokma: installable harness by SiomTrading"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "psycopg[binary]==3.3.8",
    "faster-whisper==1.2.1",
    "av==15.1.0",
    # onnxruntime (pulled by faster-whisper) stopped publishing macOS Intel wheels after 1.23.2; newer ones only exist for
    # arm64. The pin applies to that platform only, so the lock resolves for the five real platforms (task 3173).
    "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime==1.31.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pywinpty==3.0.3; sys_platform == 'win32'",
    "keyring==25.7.0",
    "databento==0.90.0",
    # Document readers for project libraries (task 3187, SPEC-009 P3). Pure Python, no native build.
    "pypdf==7.0.1",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
]

[project.scripts]
hokma = "hokma_cli.main:main"

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[dependency-groups]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/hokma", "cli/hokma_cli"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
