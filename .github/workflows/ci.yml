name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No origin references and no handwritten Spanish
        run: python3 scripts/check_repo_rules.py
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest
  docs-tests:
    # Project documents (SPEC-009 P9): the readers, the store and the endpoints run on the two platforms where
    # students work. Paths with spaces and accents, and removing a file just read, only fail on Windows.
    if: github.repository == 'SiomTrading/hokma-dev'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Document tests
        shell: bash
        run: uv run pytest backend/tests/test_docs_*.py
  library-tests:
    # The Library (SPEC-010 P14): the folders, the model download, the embedder, the vector store and the search run on
    # every platform where students work. Paths with spaces and accents, and removing a file just read, only fail on
    # Windows; sqlite-vec ships a different binary per platform. The `slow` cases need the real model and stay out.
    if: github.repository == 'SiomTrading/hokma-dev'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # The Python the installer gives the student: a uv-managed CPython, never the runner's own.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --python 3.12
      - name: vec-load-smoke
        shell: bash
        run: uv run python scripts/vec_load_smoke.py
      - name: Library tests
        shell: bash
        run: >-
          uv run pytest -m "not slow"
          backend/tests/test_library_*.py backend/tests/test_folder_*.py backend/tests/test_folders_api.py
          backend/tests/test_model_download.py backend/tests/test_embedder.py backend/tests/test_vector_store.py
          backend/tests/test_hybrid_search.py
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
      - name: Committed dashboard/dist must match a fresh build
        run: git diff --exit-code -- dashboard/dist && test -z "$(git status --porcelain -- dashboard/dist)"
  installer-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest backend/tests/test_installer_e2e.py
        env:
          HOKMA_E2E: "1"
