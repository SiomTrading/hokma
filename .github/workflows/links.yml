name: links
# Checks the links of docs/research/reading-list.md. The network is used only in this job, never in the tests.
on:
  pull_request:
    paths:
      - docs/research/reading-list.md
      - .github/workflows/links.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reading-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every link answers
        run: |
          python3 - <<'PY'
          import re
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          text = Path("docs/research/reading-list.md").read_text(encoding="utf-8")
          urls = sorted(set(re.findall(r"\((https?://[^)\s]+)\)", text)))
          # Some sites answer 403 or 429 to any script: that is not a dead link.
          tolerated = {403, 429}
          dead = []
          for url in urls:
              request = urllib.request.Request(url, headers={"User-Agent": "link-check"})
              try:
                  urllib.request.urlopen(request, timeout=20).close()
              except urllib.error.HTTPError as error:
                  if error.code not in tolerated:
                      dead.append(f"{error.code} {url}")
              except (urllib.error.URLError, TimeoutError, OSError) as error:
                  dead.append(f"error {url} ({error})")
          print(f"checked {len(urls)} links, {len(dead)} dead")
          print("\n".join(dead))
          sys.exit(1 if dead else 0)
          PY
