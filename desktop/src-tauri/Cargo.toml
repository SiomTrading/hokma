[package]
name = "hokma-desktop"
version = "0.0.0"
description = "Hokma desktop window: starts and stops the local engine and shows its panel"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain HTTP to 127.0.0.1 only: no TLS.
ureq = { version = "2", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
