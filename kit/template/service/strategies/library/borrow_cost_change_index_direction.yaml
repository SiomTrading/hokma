id: "borrow_cost_change_index_direction"
name: "Index direction from the daily change of stock borrow cost"
ref: "LIB-052"
asset_class: "equities"
lines: [SWC]
horizon: "days"
rebalance: "daily"
universe: "A broad US equity ETF and a daily aggregate of the synthetic borrow cost across about 4900 stocks and ETFs."
signal: "Mean borrow intensity today minus yesterday."
